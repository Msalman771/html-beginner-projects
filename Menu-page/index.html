<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="stylee.css">
    <title>Restaurant Menu</title>

</head>
<body>

    <h1>🍽️ Restaurant Menu</h1>

    <table>
        <tr>
            <th>Item</th>
            <th>Description</th>
            <th class="price">Price</th>
        </tr>

        <tr>
            <td>Chicken Biryani</td>
            <td>Spicy rice with chicken</td>
            <td class="price">Rs. 350</td>
        </tr>

        <tr>
            <td>Beef Burger</td>
            <td>Juicy grilled beef burger</td>
            <td class="price">Rs. 450</td>
        </tr>

        <tr>
            <td>Pizza</td>
            <td>Cheesy pizza with toppings</td>
            <td class="price">Rs. 800</td>
        </tr>

        <tr>
            <td>French Fries</td>
            <td>Crispy golden fries</td>
            <td class="price">Rs. 200</td>
        </tr>

        <tr>
            <td>Cold Drink</td>
            <td>Chilled soft drink</td>
            <td class="price">Rs. 100</td>
        </tr>

    </table>
    <button class="button">Order Now</button>

</body>
</html>
